version: 1
extends:
  - https://raw.githubusercontent.com/myst-contrib/myst-contrib.github.io/main/docs/footer.yml
project:
  id: myst-tabulator
  title: myst-tabulator
  github: https://github.com/myst-contrib/myst-tabulator
  plugins:
    - ../src/tabulator.mjs
    - https://raw.githubusercontent.com/jupyter-book/myst-plugins/main/plugins/demo/src/index.mjs
  toc:
    - file: index.md
    - file: jupyter.md
    - title: Themes
      children:
        - pattern: themes/*.md

site:
  template: book-theme
  options:
    logo_text: myst-tabulator
